<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HypeUp – Role-Based Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
 <div class="top">
  <a class="logo" href="index.html" style="color:var(--accent)">HYPEUP.</a>
  <div class="acts">
   <a class="btn sm ghost" href="index.html">← Back to Events</a>
  </div>
 </div>

 <main style="max-width:560px;margin:24px auto 60px">
  <div class="kicker">Role-Based Access Control</div>
  <h2 style="font-size:2rem;margin:6px 0 8px">Sign in to HypeUp</h2>
  <p style="color:var(--muted);margin:0 0 22px">Choose your role to access your dedicated campus portal.</p>

  <div class="tabs" role="tablist" aria-label="Select Role">
   <button class="tab active" type="button" data-role="student">Student</button>
   <button class="tab" type="button" data-role="faculty">Faculty</button>
   <button class="tab" type="button" data-role="admin">Admin</button>
  </div>

  <div class="form wide">
   <div id="modeSwitch" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <b id="formHeading" style="font-size:1.15rem">Student Sign In</b>
    <button type="button" class="btn xs ghost" id="toggleSignup">New student? Sign up</button>
   </div>

   <form id="authForm" novalidate>
    <div id="signupFields" hidden>
     <label for="name">Full Name</label>
     <input id="name" placeholder="e.g., Aarav Sharma" autocomplete="name">
     <div class="form-row">
      <div>
       <label for="usn">USN / Student ID</label>
       <input id="usn" placeholder="e.g., ENG25CS0042" style="text-transform:uppercase">
      </div>
      <div>
       <label for="dept">Department</label>
       <select id="dept">
        <option>CSE</option><option>ISE</option><option>ECE</option><option>AI &amp; ML</option><option>Data Science</option><option>Mechanical</option><option>Civil</option>
       </select>
      </div>
     </div>
    </div>

    <label for="email">Email Address</label>
    <input id="email" type="email" placeholder="student@hypeup.edu" autocomplete="email">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter password" autocomplete="current-password">

    <button class="btn" type="submit" id="submitBtn">Sign In as Student →</button>
    <div class="msg" id="msg" role="alert"></div>
   </form>
  </div>
 </main>
</div>

<script>
const $=id=>document.getElementById(id);
let role="student", isSignup=false;

const ROLE_CONFIG={
 student:{placeholder:"student@campus.edu",dest:"student.html"},
 faculty:{placeholder:"faculty@campus.edu",dest:"faculty.html"},
 admin:{placeholder:"admin@campus.edu",dest:"admin.html"}
};

// Redirect if already logged in
(function checkExisting(){
 try{
  const tok=sessionStorage.getItem("hu_token");
  const u=JSON.parse(sessionStorage.getItem("hu_user")||"null");
  if(tok&&u&&ROLE_CONFIG[u.role])location.replace(ROLE_CONFIG[u.role].dest);
 }catch(e){}
})();

function renderUI(){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.role===role));
 const canSignup=role==="student";
 $("toggleSignup").hidden=!canSignup;
 if(!canSignup)isSignup=false;
 $("signupFields").hidden=!isSignup;
 const titleRole=role.charAt(0).toUpperCase()+role.slice(1);
 $("formHeading").textContent=isSignup?"Create Student Account":`${titleRole} Sign In`;
 $("toggleSignup").textContent=isSignup?"Already have an account? Sign in":"New student? Sign up";
 $("submitBtn").textContent=isSignup?"Create Account & Continue →":`Sign In as ${titleRole} →`;
 $("email").placeholder=ROLE_CONFIG[role].placeholder;
 $("msg").textContent="";
}

document.querySelectorAll(".tab").forEach(t=>{
 t.onclick=()=>{role=t.dataset.role;renderUI()};
});
$("toggleSignup").onclick=()=>{isSignup=!isSignup;renderUI()};

$("authForm").onsubmit=async e=>{
 e.preventDefault();
 const m=$("msg");m.className="msg bad";m.textContent="";
 const email=$("email").value.trim(),password=$("password").value;
 const url=isSignup?"/api/auth/register":"/api/auth/login";
 const body=isSignup
  ?{name:$("name").value.trim(),email,usn:$("usn").value.trim(),department:$("dept").value,password}
  :{email,password,role};
 try{
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||"Authentication failed.");
  sessionStorage.setItem("hu_token",d.token);
  sessionStorage.setItem("hu_user",JSON.stringify(d.user));
  location.href=ROLE_CONFIG[d.user.role].dest;
 }catch(err){m.textContent=err.message}
};

// Support ?role=faculty or ?role=admin query param
const qp=new URLSearchParams(location.search).get("role");
if(qp&&ROLE_CONFIG[qp])role=qp;
renderUI();
</script>
</body>
</html>
